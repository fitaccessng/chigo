{% extends 'dashboard_base.html' %}
{% block title %}Review your move | Chigo Relocations{% endblock %}
{% block dashboard_content %}
<section class="mx-auto max-w-2xl px-4 py-12">
  <a href="{{ url_for('customer.booking_detail', booking_id=booking.id) }}" class="text-sm font-semibold text-brand-700 underline">Back to booking</a>
  <h1 class="mt-4 text-3xl font-black">Review {{ booking.booking_number }}</h1>
  <form method="post" class="mt-8 space-y-5">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="block font-semibold">Rating
      <select name="rating" required class="mt-2 block w-full rounded-lg border border-stone-300 bg-white px-3 py-3">
        <option value="">Choose a rating</option>
        {% for rating in range(5, 0, -1) %}<option value="{{ rating }}">{{ rating }} / 5</option>{% endfor %}
      </select>
    </label>
    <label class="block font-semibold">Comment <span class="font-normal text-stone-500">(optional)</span>
      <textarea name="comment" maxlength="2000" rows="5" class="mt-2 block w-full rounded-lg border border-stone-300 px-3 py-3"></textarea>
    </label>
    <button type="submit" class="rounded-lg bg-brand-700 px-5 py-3 font-semibold text-white">Submit review</button>
  </form>
</section>
{% endblock %}
