{% extends 'dashboard_base.html' %}
{% block title %}Report an issue | Chigo Relocations{% endblock %}
{% block dashboard_content %}
<section class="mx-auto max-w-2xl px-4 py-12">
  <a href="{{ url_for('customer.booking_detail', booking_id=booking.id) }}" class="text-sm font-semibold text-brand-700 underline">Back to booking</a>
  <h1 class="mt-4 text-3xl font-black">Report an issue</h1>
  <p class="mt-2 text-stone-600">Booking {{ booking.booking_number }}</p>
  <form method="post" class="mt-8 space-y-5">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="block font-semibold">Issue type
      <select name="incident_type" required class="mt-2 block w-full rounded-lg border border-stone-300 bg-white px-3 py-3">
        <option value="">Select issue type</option>
        <option>Damaged item</option><option>Missing item</option><option>Service concern</option><option>Other</option>
      </select>
    </label>
    <label class="block font-semibold">Item <span class="font-normal text-stone-500">(optional)</span>
      <input name="item" maxlength="120" class="mt-2 block w-full rounded-lg border border-stone-300 px-3 py-3">
    </label>
    <label class="block font-semibold">Description
      <textarea name="description" required maxlength="5000" rows="5" class="mt-2 block w-full rounded-lg border border-stone-300 px-3 py-3"></textarea>
    </label>
    <button type="submit" class="rounded-lg bg-brand-700 px-5 py-3 font-semibold text-white">Submit report</button>
  </form>
</section>
{% endblock %}
