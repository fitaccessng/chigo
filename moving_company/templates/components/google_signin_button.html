{% macro google_signin_button(next_path=None, label='Continue with Google', link_mode=false) %}
<form method="get" action="{{ url_for('auth.google_link' if link_mode else 'auth.google_login') }}" data-google-signin>
  {% if next_path %}<input type="hidden" name="next" value="{{ next_path }}">{% endif %}
  <button type="submit" aria-label="{{ label }}" class="w-full inline-flex min-h-11 items-center justify-center gap-3 rounded-xl border border-stone-300 bg-white px-4 py-2.5 text-sm font-semibold text-stone-700 shadow-sm transition hover:bg-stone-50 focus:outline-none focus:ring-2 focus:ring-brand-700 focus:ring-offset-2 disabled:cursor-wait disabled:opacity-70">
    <svg aria-hidden="true" class="h-5 w-5 shrink-0" viewBox="0 0 48 48">
      <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/>
      <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4 1.9-6.9 1.9-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/>
      <path fill="#FBBC05" d="M12.6 27.5a12 12 0 0 1 0-7v-5.3H5.8a20 20 0 0 0 0 17.6l6.8-5.3Z"/>
      <path fill="#EA4335" d="M24 12.1c3 0 5.6 1 7.7 3l5.8-5.8A19.4 19.4 0 0 0 24 4 20 20 0 0 0 5.8 15.2l6.8 5.3c1.6-4.8 6.1-8.4 11.4-8.4Z"/>
    </svg>
    <span data-google-label>{{ label }}</span>
  </button>
</form>
<script>
  document.currentScript.previousElementSibling.addEventListener('submit', function () {
    const button = this.querySelector('button');
    button.disabled = true;
    button.querySelector('[data-google-label]').textContent = 'Connecting to Google…';
  });
</script>
{% endmacro %}
