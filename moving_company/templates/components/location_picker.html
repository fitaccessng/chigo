{% macro location_picker(kind, title, subtitle, placeholder, confirm_label) %}
<div class="location-picker rounded-2xl border border-slate-200/80 bg-white p-5 sm:p-6 shadow-sm" data-location-kind="{{ kind }}">
  <div class="flex items-center justify-between border-b border-slate-100 pb-4">
    <div class="flex items-center gap-3">
      <div class="flex h-9 w-9 items-center justify-center rounded-xl {% if kind == 'pickup' %}bg-emerald-500{% else %}bg-indigo-600{% endif %} text-white font-black text-sm shadow-sm {% if kind == 'pickup' %}shadow-emerald-500/20{% else %}shadow-indigo-600/20{% endif %}">
        {{ 'A' if kind == 'pickup' else 'B' }}
      </div>
      <div>
        <h2 class="text-base font-bold text-slate-900">{{ title }}</h2>
        <p class="text-xs text-slate-500">{{ subtitle }}</p>
      </div>
    </div>
    <span class="text-[11px] font-bold tracking-wide {% if kind == 'pickup' %}text-emerald-700 bg-emerald-50 border border-emerald-200{% else %}text-indigo-700 bg-indigo-50 border border-indigo-200{% endif %} px-2.5 py-1 rounded-full">
      {{ 'Origin' if kind == 'pickup' else 'Destination' }}
    </span>
  </div>

  <div class="mt-5 space-y-4">
    <div class="relative">
      <label for="{{ kind }}_search" class="block text-[11px] font-bold uppercase tracking-[0.12em] text-slate-700">Search location</label>
      <div class="relative mt-2">
        <input
          id="{{ kind }}_search"
          type="text"
          placeholder="{{ placeholder }}"
          autocomplete="off"
          class="w-full rounded-xl border border-slate-200 bg-slate-50/50 pl-10 pr-4 py-3.5 text-sm text-slate-900 font-medium placeholder-slate-400 focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
        >
        <svg class="pointer-events-none absolute left-3.5 top-4 h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
      <div id="{{ kind }}_dropdown" class="hidden absolute z-30 mt-1 w-full max-h-64 overflow-y-auto rounded-xl border border-slate-200 bg-white shadow-xl divide-y divide-slate-100 text-xs"></div>
    </div>

    <div class="rounded-xl border border-slate-200 bg-slate-50/60 p-3">
      <div id="{{ kind }}_selected_summary" class="hidden text-[11px] text-slate-700"></div>
    </div>

    <div class="grid grid-cols-1 gap-3 md:grid-cols-3">
      <div class="md:col-span-2">
        <label class="block text-xs font-semibold text-slate-700">Full street address</label>
        <input id="{{ kind }}_address" type="text" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm font-medium text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" placeholder="e.g. No. 12 Yakubu Gowon Way" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700">Unit / flat</label>
        <input id="{{ kind }}_unit" type="text" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm font-medium text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" placeholder="e.g. Flat 4B" />
      </div>
    </div>

    <div class="flex flex-col gap-2 pt-2 sm:flex-row sm:items-center sm:justify-between">
      <button type="button" id="{{ kind }}_current_location" class="text-[10px] font-semibold text-indigo-600 hover:text-indigo-700 transition-colors">Use my current location</button>
      <button type="button" id="{{ kind }}_confirm" class="inline-flex items-center justify-center rounded-xl {% if kind == 'pickup' %}bg-emerald-600 hover:bg-emerald-700{% else %}bg-indigo-600 hover:bg-indigo-700{% endif %} px-4 py-2.5 text-xs font-bold text-white shadow-sm transition-colors">
        {{ confirm_label }}
      </button>
    </div>
  </div>
</div>
{% endmacro %}
